<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 AliExpress Orders Analyzer Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: none;
            --glass-bg: #ffffff;
            --glass-border: #e2e8f0;
            --glass-glow: rgba(99, 102, 241, 0.04);
            --text-primary: #0f172a;
            --text-muted: #64748b;
            --color-emerald: #16a34a;
            --color-amber: #d97706;
            --color-sky: #0284c7;
            --color-indigo: #4f46e5;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2.5rem 1.5rem;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
        }
        
        .header-title h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(to right, #4f46e5, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.25rem;
        }
        
        .header-title p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2.5rem;
        }
        
        .stat-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            padding: 1.25rem 1.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03);
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(99, 102, 241, 0.25);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        
        .stat-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.35rem;
        }
        
        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
        }
        
        /* Section headers */
        .section-header {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        /* Badges */
        .badge {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            white-space: nowrap;
        }
        
        .badge-confirmed {
            color: var(--color-sky);
            background: rgba(2, 132, 199, 0.08);
            border-color: rgba(2, 132, 199, 0.15);
        }
        
        .badge-shipped {
            color: var(--color-amber);
            background: rgba(217, 119, 6, 0.08);
            border-color: rgba(217, 119, 6, 0.15);
        }
        
        .badge-delivered {
            color: var(--color-emerald);
            background: rgba(22, 163, 74, 0.08);
            border-color: rgba(22, 163, 74, 0.15);
        }
        
        /* Table Layout */
        .table-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            padding: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            overflow-x: auto;
            margin-bottom: 3.5rem;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        
        th {
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--glass-border);
            white-space: nowrap;
            vertical-align: middle;
        }
        
        td {
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--glass-border);
            vertical-align: middle;
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        .tbl-order-id {
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
        }
        
        .tbl-tracking {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-primary);
            white-space: nowrap;
        }
        
        .tbl-carrier {
            white-space: nowrap;
        }
        
        .tbl-event-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
            max-width: 250px;
            line-height: 1.2;
            white-space: normal;
        }
        
        /* Items list inside table */
        .nested-items-table {
            width: 100%;
            border-collapse: collapse;
            margin: 0;
            background: transparent;
            min-width: 320px;
        }
        
        .nested-items-table td {
            padding: 0.35rem 0.5rem;
            font-size: 0.8rem;
            border-bottom: 1px solid var(--glass-border);
            vertical-align: middle;
            background: transparent;
        }
        
        .nested-items-table tr:last-child td {
            border-bottom: none;
        }
        
        .nested-item-name {
            color: var(--text-primary);
            font-weight: 500;
            line-height: 1.3;
            text-align: left;
        }
        
        .nested-item-qty {
            color: var(--text-muted);
            text-align: center;
            white-space: nowrap;
            width: 40px;
            font-weight: 500;
        }
        
        .nested-item-price {
            color: var(--color-indigo);
            font-weight: 600;
            text-align: right;
            white-space: nowrap;
            width: 70px;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 1.5rem 1rem;
            }
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .table-card {
                padding: 0;
                background: transparent;
                border: none;
                box-shadow: none;
            }
            table, thead, tbody, th, td, tr {
                display: block;
            }
            thead {
                display: none;
            }
            tr {
                background: var(--glass-bg);
                border: 1px solid var(--glass-border);
                border-radius: 1rem;
                padding: 1.25rem;
                margin-bottom: 1.25rem;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            }
            td {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                padding: 0.6rem 0;
                border-bottom: 1px solid rgba(226, 232, 240, 0.5);
                font-size: 0.9rem;
            }
            td:last-child {
                border-bottom: none;
                padding-bottom: 0;
            }
            td::before {
                content: attr(data-label);
                font-size: 0.7rem;
                font-weight: 700;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 0.05em;
                margin-bottom: 0.35rem;
            }
            .nested-items-table {
                min-width: 100%;
            }
            .nested-items-table tr {
                padding: 0.25rem 0;
                border: none;
                background: transparent;
                box-shadow: none;
                margin-bottom: 0;
            }
            .nested-items-table td {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px dashed var(--glass-border);
                padding: 0.35rem 0;
            }
            .nested-items-table td::before {
                display: none;
            }
            .tbl-event-text {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <h1>AliExpress Order Status Dashboard</h1>
                <p>Last Sync: 2026-07-20 06:40:33</p>
            </div>
        </header>
        <!-- Summary Stats Section -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Active Orders In Transit</div>
                <div class="stat-value" style="color: var(--color-amber);">0</div>
            </div>
        </div>
        
        <!-- Active In-Transit Orders Section -->
        <div class="section-header">
            <span>🚚</span> Active Orders In Transit (Sorted by Status)
        </div>
        
        <div style="background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 1rem; padding: 2rem; text-align: center; color: var(--text-muted); margin-bottom: 3.5rem;">
            No active orders currently in transit.
        </div>
    </div>
</body>
</html>
