[project]
name = "ali-express-orders-analyzer"
version = "0.1.0"
description = "Autonomous Gmail Extraction Agent for AliExpress orders using Gemini API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.120.0",
    "google-genai>=0.1.1",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.60.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["src"]
